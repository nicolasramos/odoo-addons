name: Quality

on:
  push:
    branches: [main, "19"]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Odoo addons statically
        run: python3 .github/scripts/validate_addon.py

  odoo19:
    runs-on: ubuntu-latest
    needs: static
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install and test addons on Odoo 19
        run: >-
          docker run --rm
          --network "${{ job.services.db.network }}"
          --volume "$GITHUB_WORKSPACE:/mnt/extra-addons:ro"
          odoo:19.0
          odoo
          --database ci
          --db_host db
          --db_port 5432
          --db_user odoo
          --db_password odoo
          --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
          --init mail_bot_odooclaw,account_dynamic_rules
          --test-enable
          --stop-after-init
